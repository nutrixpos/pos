databases:
  - name: core
    # type: mongo  -> connect to an external/centralized mongodb server (host/port)
    # type: ferret -> embedded local database (FerretDB + SQLite), no server install needed
    type: mongo
    host: 127.0.0.1
    port: 27017
    # uri is optional; when set it takes precedence over host/port and may
    # include authentication, TLS options and multiple hosts, e.g.
    #   uri: mongodb://user:pass@host1:27017,host2:27017/?replicaSet=rs0&tls=true
    uri: ""
    database: nutrix
    username: ""
    password: ""
    # file_path is used when type is "ferret": directory where the local db file is stored
    file_path: ./data/db
    tables: # this is to allow changing the following specific table names
      sales: sales

uploads_path: "./mnt/public"

auth:
  jwt_secret: "your-super-secret-jwt-key-change-in-production"
  jwt_expire_hrs: 24
  enabled: true

zitadel:
  domain: "zitadel"
  port: 8080
  key_path: "./mnt/zitadel-key.json" # this is the path to your zitadel key related to your root directory of backend
  enabled: false

serve_frontend: true
  
timezone: Africa/Cairo
env: dev