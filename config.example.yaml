databases:
  - name: core
    # type: ferret -> embedded local database (FerretDB + SQLite), no server install needed
    # type: mongo  -> connect to an external/centralized mongodb server (host/port)
    type: ferret
    # host, port, username and password are only used when type is "mongo"
    host: 127.0.0.1
    port: 27017
    database: nutrix
    username: ""
    password: ""
    # file_path is used when type is "ferret": directory where the local db file is stored
    file_path: ./data/db
    tables: # this is to allow changing the following specific table names
      sales: sales

uploads_path: "./mnt/public"
# Backups are written here before a destructive import. Keep this
# outside uploads_path so backups are never served publicly.
backups_path: "./mnt/backups"

# Receipt rendering uses a headless Chromium-based browser to turn the receipt
# template into an image before sending it to the printer. The browser
# executable is configured from the Settings page in the UI.
printing:
  # Disable the browser sandbox. Needed in containers or when running as root.
  # Can also be set with PRINTING_NO_SANDBOX.
  no_sandbox: false

auth:
  jwt_secret: "your-super-secret-jwt-key-change-in-production"
  jwt_expire_hrs: 24
  enabled: true

zitadel:
  domain: "zitadel"
  port: 8080
  key_path: "./mnt/zitadel-key.json" # this is the path to your zitadel key related to your root directory of backend
  enabled: false

serve_frontend: true
  
timezone: Africa/Cairo
env: dev